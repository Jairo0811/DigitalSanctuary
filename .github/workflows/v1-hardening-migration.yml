name: v1.0.1 hardening migration

on:
  push:
    branches: [ "chore/v1.0.1-production-hardening" ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: chore/v1.0.1-production-hardening
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Migrate Kotlin packages to final namespace
        shell: bash
        run: |
          set -euo pipefail
          for source_set in main test androidTest; do
            old="app/src/${source_set}/java/com/example"
            new="app/src/${source_set}/java/com/jairomatias/digitalsanctuary"
            if [ -d "$old" ]; then
              mkdir -p "$(dirname "$new")"
              git mv "$old" "$new"
            fi
          done

          while IFS= read -r -d '' file; do
            sed -i 's/com\.example/com.jairomatias.digitalsanctuary/g' "$file"
          done < <(find app/src -type f \( -name '*.kt' -o -name '*.xml' \) -print0)

          if grep -R "com\.example" app/src --include='*.kt' --include='*.xml'; then
            echo "Legacy com.example package references remain." >&2
            exit 1
          fi

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Validate migrated project
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Commit generated hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize packages and add Gradle wrapper"
          git push origin HEAD:chore/v1.0.1-production-hardening
